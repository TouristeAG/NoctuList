name: Desktop Linux release

on:
  # NOTE: Automatic release builds are handled by release.yml (triggered on tag push).
  # Use this workflow only for standalone manual builds (e.g. to test packaging).
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-linux:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"

      - name: Install packaging dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y fakeroot binutils libfuse2

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Read version from version.json
        id: version
        run: |
          VERSION=$(python3 -c "import json; print(json.load(open('version.json'))['latestVersionName'])")
          echo "name=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Build Linux packages
        run: |
          ./gradlew :desktopApp:packageReleaseDeb :desktopApp:packageReleaseAppImage --no-daemon

      # Compose's packageReleaseAppImage is jpackage --type app-image (a directory
      # under main-release/app/), not a Linux .AppImage file. Wrap it with appimagetool.
      - name: Wrap jpackage directory into .AppImage
        run: |
          chmod +x scripts/build-appimage.sh
          APP_VERSION_NAME="${{ steps.version.outputs.name }}" ./scripts/build-appimage.sh

      - name: Flatten Linux packages
        run: |
          VERSION="${{ steps.version.outputs.name }}"
          DEB=$(ls desktopApp/build/compose/packaged/main-release/deb/*.deb 2>/dev/null | head -1)
          APPIMAGE=$(ls desktopApp/build/compose/packaged/main-release/appImage/*.AppImage 2>/dev/null | head -1)
          if [ -z "$DEB" ]; then
            DEB=$(find desktopApp/build/compose/packaged -name "*.deb" | head -1)
          fi
          if [ -z "$APPIMAGE" ]; then
            APPIMAGE=$(find desktopApp/build/compose/packaged -iname "*.AppImage" | head -1)
          fi
          if [ -z "$DEB" ] || [ -z "$APPIMAGE" ]; then
            echo "ERROR: Linux packages missing"
            find desktopApp/build/compose/packaged -maxdepth 4 || true
            exit 1
          fi
          cp "$DEB" "NoctuList-${VERSION}.deb"
          cp "$APPIMAGE" "NoctuList-${VERSION}.AppImage"
          chmod +x "NoctuList-${VERSION}.AppImage"

      - name: Upload workflow artifacts
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: noctulist-linux-desktop
          path: |
            NoctuList-*.deb
            NoctuList-*.AppImage
          if-no-files-found: error

      - name: Upload release assets
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          fail_on_unmatched_files: true
          files: |
            NoctuList-*.deb
            NoctuList-*.AppImage
