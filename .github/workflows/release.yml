name: Release — all platforms

# ─────────────────────────────────────────────────────────────────────────────
# USAGE
# ─────────────────────────────────────────────────────────────────────────────
# Push a version tag to trigger a full release automatically:
#
#   git tag 2.1.0
#   git push origin 2.1.0
#
# That's it. This workflow will:
#   1. Build all 7 artifacts in parallel (Android APK, 2× macOS DMG,
#      Windows MSI + EXE, Linux DEB + AppImage)
#   2. Create the GitHub Release with the correct tag and release notes
#      (from .github/release-notes/<version>.md if it exists)
#   3. Attach every artifact to the release
#
# You can also trigger this manually from Actions → Run workflow (builds
# and creates a release from the current version in version.json).
# ─────────────────────────────────────────────────────────────────────────────

on:
  push:
    tags:
      - '[0-9]+.[0-9]+.[0-9]+'    # e.g. 2.1.0
      - 'v[0-9]+.[0-9]+.[0-9]+'   # e.g. v2.1.0 (leading v stripped below)
  workflow_dispatch:
    inputs:
      prerelease:
        description: 'Mark as pre-release?'
        required: false
        default: 'false'
        type: choice
        options: ['false', 'true']

permissions:
  contents: write   # needed to create and attach release assets

# ─────────────────────────────────────────────────────────────────────────────
# JOBS
# ─────────────────────────────────────────────────────────────────────────────

jobs:

  # ═══════════════════════════════════════════════════════════════════════════
  # 1. ANDROID APK
  # ═══════════════════════════════════════════════════════════════════════════
  build-android:
    name: Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Read version
        id: version
        run: |
          VERSION=$(python3 -c "import json; print(json.load(open('version.json'))['latestVersionName'])")
          echo "name=$VERSION" >> "$GITHUB_OUTPUT"

      # Existing devices were installed from Android Studio APKs signed with
      # ~/.android/debug.keystore. A runner-generated debug key is a different
      # cert → Package Installer reports "App not updated".
      - name: Decode Android release keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          missing=0
          for var in ANDROID_KEYSTORE_BASE64 ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD; do
            if [ -z "${!var}" ]; then
              echo "::error::Missing repository secret ${var}."
              missing=1
            fi
          done
          if [ "$missing" -eq 1 ]; then
            exit 1
          fi
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/noctulist-release.keystore"
          echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/noctulist-release.keystore" >> "$GITHUB_ENV"

      - name: Build Android APK
        env:
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/noctulist-release.keystore
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          REQUIRE_RELEASE_SIGNING: "true"
        run: ./gradlew :app:assembleRelease --no-daemon

      - name: Verify APK is signed with the production cert
        run: |
          APK="app/build/outputs/apk/release/app-release.apk"
          if [ ! -f "$APK" ]; then
            echo "::error::APK not found at $APK"
            exit 1
          fi
          # AGP 8 + minSdk 26 signs with v2/v3 only. keytool -printcert -jarfile
          # only reads JAR (v1) signatures and reports "Not a signed jar file".
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          APSIGNER=""
          if [ -n "$SDK_ROOT" ]; then
            APSIGNER=$(find "$SDK_ROOT/build-tools" -name apksigner 2>/dev/null | sort -V | tail -1)
          fi
          if [ -z "$APSIGNER" ]; then
            echo "::error::apksigner not found (ANDROID_HOME=${SDK_ROOT:-unset})"
            exit 1
          fi
          CERT=$("$APSIGNER" verify --print-certs "$APK" 2>&1) || {
            echo "::error::APK failed apksigner verify (unsigned or corrupt)."
            echo "$CERT"
            exit 1
          }
          echo "$CERT"
          EXPECTED="67:1C:E8:D6:DD:CC:01:5D:2C:62:C8:82:DC:5C:84:FA:05:EC:3D:29"
          ACTUAL=$(printf '%s\n' "$CERT" | grep -iE 'SHA-1 digest:|SHA1 digest:' | head -1 | awk '{print $NF}')
          normalize_sha1() { printf '%s' "$1" | tr -d ' \t:' | tr '[:lower:]' '[:upper:]'; }
          EXPECTED_NORM=$(normalize_sha1 "$EXPECTED")
          ACTUAL_NORM=$(normalize_sha1 "$ACTUAL")
          echo "Expected SHA-1: $EXPECTED"
          echo "Actual SHA-1:   $ACTUAL"
          if [ -z "$ACTUAL_NORM" ] || [ "$ACTUAL_NORM" != "$EXPECTED_NORM" ]; then
            echo "::error::APK SHA-1 does not match the production keystore. Devices will refuse the update."
            exit 1
          fi

      - name: Rename APK
        run: |
          cp app/build/outputs/apk/release/app-release.apk \
             "app-release-${{ steps.version.outputs.name }}.apk"
          ls -lh app-release-*.apk

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: app-release-*.apk
          if-no-files-found: error
          retention-days: 3

  # ═══════════════════════════════════════════════════════════════════════════
  # 2. macOS DMG — Intel (x86_64) + Apple Silicon (arm64) in parallel
  #
  # Why two runners? jpackage bundles the host JVM, so there is no
  # cross-compilation path. Each runner produces its own native DMG.
  # ═══════════════════════════════════════════════════════════════════════════
  build-macos:
    name: macOS DMG (${{ matrix.arch }})
    strategy:
      fail-fast: false    # build both arches even if one fails
      matrix:
        include:
          - runner: macos-15-intel  # GitHub-hosted Intel (x86_64) — last supported Intel runner
            arch: x86_64
          - runner: macos-15        # GitHub-hosted Apple Silicon (arm64 / M1+)
            arch: arm64

    runs-on: ${{ matrix.runner }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # architecture is auto-selected by setup-java (x64 on macos-13, aarch64 on macos-14).
      # Temurin is required — Homebrew JDK ships without jpackage.
      - name: Set up Temurin JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"

      - name: Verify JVM is native ${{ matrix.arch }}
        run: |
          ARCH=$(java -XshowSettings:all -version 2>&1 | grep "os.arch" | awk '{print $NF}')
          echo "JVM os.arch = $ARCH"
          if [[ "${{ matrix.arch }}" == "arm64" && "$ARCH" != "aarch64" ]]; then
            echo "ERROR: expected aarch64 JVM on Apple Silicon runner, got $ARCH"; exit 1
          fi
          if [[ "${{ matrix.arch }}" == "x86_64" && "$ARCH" != "x86_64" ]]; then
            echo "ERROR: expected x86_64 JVM on Intel runner, got $ARCH"; exit 1
          fi

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Read version
        id: version
        run: |
          VERSION=$(python3 -c "import json; print(json.load(open('version.json'))['latestVersionName'])")
          echo "name=$VERSION" >> "$GITHUB_OUTPUT"

      # Recompile as a universal binary so Touch ID works on both arches
      # regardless of which DMG the user downloads.
      - name: Rebuild LocalAuthenticationEngine.dylib (universal x86_64 + arm64)
        run: |
          clang \
            -arch x86_64 \
            -arch arm64 \
            -dynamiclib \
            -framework Foundation \
            -framework LocalAuthentication \
            -o shared/src/desktopMain/resources/LocalAuthenticationEngine.dylib \
            shared/nativeengines/macos/LocalAuthenticationEngine.m
          echo "Dylib archs:"
          lipo -info shared/src/desktopMain/resources/LocalAuthenticationEngine.dylib

      - name: Build macOS DMG
        run: ./gradlew :desktopApp:packageReleaseDmg --no-daemon

      # Add the arch suffix so both DMGs can coexist as release assets.
      - name: Rename DMG with architecture suffix
        id: dmg
        run: |
          VERSION="${{ steps.version.outputs.name }}"
          SRC=$(ls desktopApp/build/compose/packaged/main-release/dmg/*.dmg | head -1)
          DEST="NoctuList-${VERSION}-${{ matrix.arch }}.dmg"
          cp "$SRC" "$DEST"
          echo "path=$DEST" >> "$GITHUB_OUTPUT"
          echo "Produced: $DEST ($(du -sh "$DEST" | cut -f1))"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: macos-${{ matrix.arch }}-dmg
          path: ${{ steps.dmg.outputs.path }}
          if-no-files-found: error
          retention-days: 3

  # ═══════════════════════════════════════════════════════════════════════════
  # 3. WINDOWS — MSI (installer) + EXE (standalone setup)
  # ═══════════════════════════════════════════════════════════════════════════
  build-windows:
    name: Windows (MSI + EXE)
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Read version
        id: version
        shell: bash
        run: |
          VERSION=$(python -c "import json; print(json.load(open('version.json'))['latestVersionName'])")
          echo "name=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Build Windows packages
        run: ./gradlew :desktopApp:packageReleaseMsi :desktopApp:packageReleaseExe --no-daemon

      # upload-artifact keeps the nested compose/packaged/... path. The publish
      # job previously attached only release-artifacts/* (one level), so MSI/EXE
      # were built but never added to the GitHub Release.
      - name: Flatten Windows installers
        id: files
        shell: bash
        run: |
          VERSION="${{ steps.version.outputs.name }}"
          MSI=$(ls desktopApp/build/compose/packaged/main-release/msi/*.msi 2>/dev/null | head -1)
          EXE=$(ls desktopApp/build/compose/packaged/main-release/exe/*.exe 2>/dev/null | head -1)
          if [ -z "$MSI" ]; then
            MSI=$(find desktopApp/build/compose/packaged -name "*.msi" | head -1)
          fi
          if [ -z "$EXE" ]; then
            EXE=$(find desktopApp/build/compose/packaged -name "*.exe" | head -1)
          fi
          if [ -z "$MSI" ] || [ -z "$EXE" ]; then
            echo "ERROR: Windows packages missing"
            find desktopApp/build/compose/packaged -type f \( -name "*.msi" -o -name "*.exe" \) || true
            exit 1
          fi
          cp "$MSI" "NoctuList-${VERSION}.msi"
          cp "$EXE" "NoctuList-${VERSION}.exe"
          ls -lh "NoctuList-${VERSION}.msi" "NoctuList-${VERSION}.exe"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-installers
          path: |
            NoctuList-*.msi
            NoctuList-*.exe
          if-no-files-found: error
          retention-days: 3

  # ═══════════════════════════════════════════════════════════════════════════
  # 4. LINUX — DEB (Debian/Ubuntu) + AppImage (universal)
  # ═══════════════════════════════════════════════════════════════════════════
  build-linux:
    name: Linux (DEB + AppImage)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"

      - name: Install packaging dependencies
        run: |
          sudo apt-get update -q
          sudo apt-get install -y fakeroot binutils libfuse2

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Read version
        id: version
        run: |
          VERSION=$(python3 -c "import json; print(json.load(open('version.json'))['latestVersionName'])")
          echo "name=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Build Linux packages
        run: ./gradlew :desktopApp:packageReleaseDeb :desktopApp:packageReleaseAppImage --no-daemon

      # Compose's packageReleaseAppImage is jpackage --type app-image (a directory
      # under main-release/app/), not a Linux .AppImage file. Wrap it with appimagetool.
      - name: Wrap jpackage directory into .AppImage
        run: |
          chmod +x scripts/build-appimage.sh
          APP_VERSION_NAME="${{ steps.version.outputs.name }}" ./scripts/build-appimage.sh

      # Compose nests DEB/AppImage under compose/packaged/... — flatten and
      # rename to the version.json URLs so publish can attach them.
      - name: Flatten Linux packages
        run: |
          VERSION="${{ steps.version.outputs.name }}"
          DEB=$(ls desktopApp/build/compose/packaged/main-release/deb/*.deb 2>/dev/null | head -1)
          APPIMAGE=$(ls desktopApp/build/compose/packaged/main-release/appImage/*.AppImage 2>/dev/null | head -1)
          if [ -z "$DEB" ]; then
            DEB=$(find desktopApp/build/compose/packaged -name "*.deb" | head -1)
          fi
          if [ -z "$APPIMAGE" ]; then
            APPIMAGE=$(find desktopApp/build/compose/packaged -iname "*.AppImage" | head -1)
          fi
          if [ -z "$DEB" ] || [ -z "$APPIMAGE" ]; then
            echo "ERROR: Linux packages missing"
            find desktopApp/build/compose/packaged -maxdepth 4 || true
            exit 1
          fi
          cp "$DEB" "NoctuList-${VERSION}.deb"
          cp "$APPIMAGE" "NoctuList-${VERSION}.AppImage"
          chmod +x "NoctuList-${VERSION}.AppImage"
          ls -lh "NoctuList-${VERSION}.deb" "NoctuList-${VERSION}.AppImage"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: linux-packages
          path: |
            NoctuList-*.deb
            NoctuList-*.AppImage
          if-no-files-found: error
          retention-days: 3

  # ═══════════════════════════════════════════════════════════════════════════
  # 5. PUBLISH RELEASE
  #
  # Waits for ALL build jobs to succeed, then:
  #   • Downloads every artifact from the workflow run
  #   • Creates the GitHub Release (tag created automatically if missing)
  #   • Attaches all files to the release
  #
  # If any build job fails, this job is skipped and the release is NOT
  # created — preventing a half-baked release with missing artifacts.
  # ═══════════════════════════════════════════════════════════════════════════
  publish-release:
    name: Publish GitHub Release
    needs: [build-android, build-macos, build-windows, build-linux]
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Resolve the version tag:
      #   • Tag push  → use the pushed tag (strip optional leading 'v')
      #   • workflow_dispatch → read from version.json
      - name: Resolve version & tag
        id: version
        run: |
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            TAG="$GITHUB_REF_NAME"
          else
            TAG=$(python3 -c "import json; print(json.load(open('version.json'))['latestVersionName'])")
          fi
          VER="${TAG#v}"   # strip leading 'v' if present
          echo "tag=$TAG"  >> "$GITHUB_OUTPUT"
          echo "name=$VER" >> "$GITHUB_OUTPUT"
          echo "Resolved: tag=$TAG  version=$VER"

      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-artifacts
          merge-multiple: true    # flatten into a single directory

      - name: Verify expected release artifacts
        run: |
          VER="${{ steps.version.outputs.name }}"
          cd release-artifacts
          find . -type f -mindepth 2 -exec mv -n {} . \;
          ls -lh
          missing=0
          for f in \
            "app-release-${VER}.apk" \
            "NoctuList-${VER}-arm64.dmg" \
            "NoctuList-${VER}-x86_64.dmg" \
            "NoctuList-${VER}.msi" \
            "NoctuList-${VER}.exe" \
            "NoctuList-${VER}.deb" \
            "NoctuList-${VER}.AppImage"
          do
            if [ ! -f "$f" ]; then
              echo "::error::Missing release asset $f"
              missing=1
            fi
          done
          if [ "$missing" -eq 1 ]; then
            echo "Files present:"
            find . -type f
            exit 1
          fi

      # Use the per-version release notes if they exist (.github/release-notes/<ver>.md),
      # otherwise fall back to the changelogShort string in version.json.
      - name: Prepare release notes
        id: notes
        run: |
          NOTES_FILE=".github/release-notes/${{ steps.version.outputs.name }}.md"
          if [[ -f "$NOTES_FILE" ]]; then
            echo "Using $NOTES_FILE"
            echo "body_path=$NOTES_FILE" >> "$GITHUB_OUTPUT"
          else
            echo "No release notes file found, generating from version.json"
            CHANGELOG=$(python3 -c "import json; print(json.load(open('version.json'))['changelogShort'])")
            {
              echo "## NoctuList ${{ steps.version.outputs.name }}"
              echo ""
              echo "$CHANGELOG"
              echo ""
              echo "---"
              echo "Full changelog: [CHANGELOG.md](CHANGELOG.md)"
            } > /tmp/release-body.md
            echo "body_path=/tmp/release-body.md" >> "$GITHUB_OUTPUT"
          fi

      - name: Create GitHub Release and attach artifacts
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: "NoctuList ${{ steps.version.outputs.name }}"
          body_path: ${{ steps.notes.outputs.body_path }}
          draft: false
          prerelease: ${{ inputs.prerelease == 'true' }}
          make_latest: true
          fail_on_unmatched_files: true
          files: |
            release-artifacts/app-release-${{ steps.version.outputs.name }}.apk
            release-artifacts/NoctuList-${{ steps.version.outputs.name }}-arm64.dmg
            release-artifacts/NoctuList-${{ steps.version.outputs.name }}-x86_64.dmg
            release-artifacts/NoctuList-${{ steps.version.outputs.name }}.msi
            release-artifacts/NoctuList-${{ steps.version.outputs.name }}.exe
            release-artifacts/NoctuList-${{ steps.version.outputs.name }}.deb
            release-artifacts/NoctuList-${{ steps.version.outputs.name }}.AppImage
