<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Profile photo</title>
  <meta name="theme-color" content="#f4f7fb" />
  <meta name="referrer" content="no-referrer" />
  <link rel="icon" type="image/png" sizes="192x192" href="/icons/icon-192.png" />
  <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
  <script src="/theme.js?v=mist-1"></script>
  <link rel="stylesheet" href="/theme.css?v=perf-1" />
  <link rel="stylesheet" href="/styles.css?v=mist-1" />
</head>
<body>
  <canvas id="topo" aria-hidden="true"></canvas>
  <header class="topbar">
    <div class="topbar-actions">
      <button type="button" class="icon-btn" data-theme-toggle></button>
      <label class="sr-only" for="lang" data-i18n="lang">Language</label>
      <select id="lang" class="lang-select" aria-label="Language">
        <option value="fr">FR</option>
        <option value="en">EN</option>
        <option value="es">ES</option>
        <option value="de">DE</option>
        <option value="it">IT</option>
      </select>
    </div>
  </header>
  <main class="page">
    <section class="card" id="state-loading">
      <p class="muted" data-i18n="loading">Loading…</p>
    </section>
    <section class="card hidden" id="state-closed">
      <h1 data-i18n="closedTitle">This link has expired</h1>
      <p class="muted" data-i18n="closedBody">This photo request is no longer open. Ask the team for a new link.</p>
    </section>
    <section class="card hidden" id="state-done">
      <div class="photo-preview done" id="done-preview" aria-hidden="true"></div>
      <h1 data-i18n="doneTitle">Thank you</h1>
      <p class="muted" data-i18n="doneBody">Your photo has been sent. You can close this page.</p>
    </section>
    <section class="card hidden" id="form">
      <h1 data-i18n="title">Profile photo</h1>
      <p class="meta" id="meta"></p>
      <p class="muted photo-intro" data-i18n="intro">Choose a clear photo of your face. It will appear on your profile.</p>
      <button type="button" class="photo-preview" id="preview" data-i18n-aria="choose">
        <span class="photo-placeholder" aria-hidden="true">
          <svg viewBox="0 0 24 24" width="44" height="44" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="8" r="4" />
            <path d="M4 21c0-4.4 3.6-8 8-8s8 3.6 8 8" />
          </svg>
        </span>
      </button>
      <input id="file" type="file" accept="image/*" hidden />
      <button type="button" class="ghost" id="choose" data-i18n="choose">Choose a photo</button>
      <button type="button" class="primary" id="upload" data-i18n="upload" disabled>Upload</button>
      <p class="muted photo-status hidden" id="status"></p>
      <p class="error hidden" id="error"></p>
    </section>
  </main>
  <script type="module" src="/topo.js?v=topo-perf-1"></script>
  <script type="module" src="/photo.js?v=mist-1"></script>
</body>
</html>
