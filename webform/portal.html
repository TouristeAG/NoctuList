<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="robots" content="noindex, nofollow" />
  <meta name="theme-color" content="#f4f7fb" />
  <meta name="referrer" content="no-referrer" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Mon espace" />
  <title>My space</title>
  <link rel="manifest" href="/manifest.webmanifest" />
  <link rel="icon" type="image/png" sizes="192x192" href="/icons/icon-192.png" />
  <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
  <script src="/theme.js?v=portal-2"></script>
  <link rel="stylesheet" href="/theme.css?v=perf-1" />
  <link rel="stylesheet" href="/portal.css?v=cert-2" />
</head>
<body class="portal">
  <canvas id="topo" aria-hidden="true"></canvas>
  <header class="topbar">
    <div class="brand" id="brand"></div>
    <div class="topbar-actions">
      <button type="button" class="icon-btn" data-theme-toggle></button>
      <label class="sr-only" for="lang" data-i18n="lang">Language</label>
      <select id="lang" class="lang-select" aria-label="Language">
        <option value="fr">FR</option>
        <option value="en">EN</option>
        <option value="es">ES</option>
        <option value="de">DE</option>
        <option value="it">IT</option>
      </select>
    </div>
  </header>

  <main class="page" id="main">
    <section class="card center auth-page" id="view-loading">
      <div class="spinner" aria-hidden="true"></div>
      <p class="muted" data-i18n="loading">Loading…</p>
    </section>

    <section class="card center auth-page hidden" id="view-disabled">
      <div class="hero-icon warn" aria-hidden="true">!</div>
      <h1 data-i18n="disabledTitle">Volunteer space unavailable</h1>
      <p class="muted" data-i18n="disabledBody"></p>
      <p class="error hidden" id="disabled-error"></p>
    </section>

    <form class="card auth-page hidden" id="view-signin" novalidate>
      <div class="auth-head">
        <img class="auth-logo hidden" id="signin-logo" alt="" />
        <h1 data-i18n="signInTitle">Sign in</h1>
        <p class="lead" data-i18n="signInLead"></p>
      </div>
      <p class="notice hidden" id="signin-notice"></p>
      <label>
        <span data-i18n="email">E-mail address</span>
        <input id="signin-email" type="email" autocomplete="username" inputmode="email" maxlength="254" required />
      </label>
      <label>
        <span data-i18n="password">Password</span>
        <span class="pw-wrap">
          <input id="signin-password" type="password" autocomplete="current-password" maxlength="128" required />
          <button type="button" class="pw-toggle" data-target="signin-password" aria-label="Show password">👁</button>
        </span>
      </label>
      <label class="check remember">
        <input id="remember" type="checkbox" />
        <span data-i18n="rememberMe">Stay signed in on this device</span>
      </label>
      <p class="error hidden" id="signin-error" role="alert"></p>
      <button type="submit" class="primary" id="signin-btn" data-i18n="signIn">Sign in</button>
      <p class="center"><button type="button" class="link-btn" id="to-reset" data-i18n="forgot">Forgot your password?</button></p>
      <div class="google-signin hidden" id="google-signin">
        <p class="or-line"><span data-i18n="orDivider">or</span></p>
        <button type="button" class="google-btn" id="google-btn">
          <svg viewBox="0 0 48 48" width="18" height="18" aria-hidden="true"><path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/><path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/><path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"/><path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/></svg>
          <span data-i18n="signInGoogle">Sign in with Google</span>
        </button>
      </div>
    </form>

    <form class="card auth-page hidden" id="view-reset" novalidate>
      <div class="auth-head">
        <h1 data-i18n="resetTitle">Reset your password</h1>
        <p class="lead" data-i18n="resetLead"></p>
      </div>
      <label>
        <span data-i18n="email">E-mail address</span>
        <input id="reset-email" type="email" autocomplete="username" inputmode="email" maxlength="254" required />
      </label>
      <p class="success hidden" id="reset-done" data-i18n="resetSent"></p>
      <p class="error hidden" id="reset-error" role="alert"></p>
      <button type="submit" class="primary" id="reset-btn" data-i18n="sendLink">Send the link</button>
      <p class="center"><button type="button" class="link-btn" id="reset-back" data-i18n="backToSignIn">Back to sign in</button></p>
    </form>

    <section class="card center auth-page hidden" id="view-verify">
      <div class="hero-icon info" aria-hidden="true">@</div>
      <h1 data-i18n="verifyTitle">Confirm your e-mail address</h1>
      <p class="muted" id="verify-body"></p>
      <p class="notice hidden" id="verify-notice"></p>
      <button type="button" class="primary" id="verify-check" data-i18n="verifiedCheck">I have confirmed it</button>
      <button type="button" class="ghost" id="verify-resend" data-i18n="resend">Send the e-mail again</button>
      <p class="center"><button type="button" class="link-btn" data-signout data-i18n="signOut">Sign out</button></p>
    </section>

    <section class="card center auth-page hidden" id="view-pending">
      <div class="spinner" id="pending-spinner" aria-hidden="true"></div>
      <h1 data-i18n="pendingTitle">Your space is being prepared</h1>
      <p class="muted" id="pending-body" data-i18n="pendingBody"></p>
      <p class="error hidden" id="pending-error"></p>
      <button type="button" class="ghost" id="pending-refresh" data-i18n="refresh">Refresh</button>
      <p class="center"><button type="button" class="link-btn" data-signout data-i18n="signOut">Sign out</button></p>
    </section>

    <section class="card center auth-page hidden" id="view-google">
      <div class="spinner" aria-hidden="true"></div>
      <h1 data-i18n="googleWaitTitle">Signing in with Google</h1>
      <p class="muted" id="google-wait-body"></p>
      <p class="center"><button type="button" class="link-btn" data-signout data-i18n="signOut">Sign out</button></p>
    </section>

    <section class="hidden" id="view-dash" aria-live="polite">
      <div class="profile-switch hidden" id="profile-switch" role="group"></div>
      <div class="dash-head">
        <div>
          <h1 id="dash-hello"></h1>
          <p class="sub" id="dash-sub"></p>
        </div>
        <div class="dash-actions">
          <button type="button" class="pill-btn hidden" id="account-btn">
            <span class="txt" data-i18n="account">My account</span>
          </button>
          <button type="button" class="pill-btn" data-signout>
            <span class="ico" aria-hidden="true">
              <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 4h3a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2h-3M10 17l5-5-5-5M15 12H3"/></svg>
            </span>
            <span class="txt" data-i18n="signOut">Sign out</span>
          </button>
        </div>
      </div>
      <div class="dash" id="dash"></div>
    </section>

    <section class="card center auth-page hidden" id="view-offline">
      <div class="offline-list" id="offline-list"></div>
    </section>
  </main>

  <dialog class="sheet" id="account-dialog" aria-labelledby="account-title">
    <div class="sheet-head">
      <h2 id="account-title">My account</h2>
      <button type="button" class="icon-btn" id="account-close" data-i18n-aria="close">✕</button>
    </div>
    <div class="sheet-body" id="account-body"></div>
  </dialog>
  <dialog class="qr-dialog" id="qr-dialog" aria-labelledby="qr-name">
    <div id="qr-box" class="qr-box"></div>
    <p id="qr-name" class="qr-name"></p>
    <p id="qr-assoc" class="qr-assoc"></p>
    <button type="button" class="primary" id="qr-close" data-i18n="close">Close</button>
  </dialog>
  <script type="module" src="/topo.js?v=topo-perf-1"></script>
  <script type="module" src="/portal.js?v=cert-4"></script>
</body>
</html>
