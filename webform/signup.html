<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="robots" content="noindex, nofollow" />
  <meta name="theme-color" content="#f4f7fb" />
  <meta name="referrer" content="no-referrer" />
  <title>Volunteer registration</title>
  <link rel="icon" type="image/png" sizes="192x192" href="/icons/icon-192.png" />
  <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
  <script src="/theme.js?v=portal-1"></script>
  <link rel="stylesheet" href="/theme.css?v=perf-1" />
  <link rel="stylesheet" href="/styles.css?v=portal-1" />
  <link rel="stylesheet" href="/portal.css?v=perf-1" />
</head>
<body class="signup">
  <canvas id="topo" aria-hidden="true"></canvas>
  <header class="topbar">
    <div class="brand hidden" id="brand"></div>
    <div class="topbar-actions">
      <button type="button" class="icon-btn" data-theme-toggle></button>
      <label class="sr-only" for="lang" data-i18n="lang">Language</label>
      <select id="lang" class="lang-select" aria-label="Language">
        <option value="fr">FR</option>
        <option value="en">EN</option>
        <option value="es">ES</option>
        <option value="de">DE</option>
        <option value="it">IT</option>
      </select>
    </div>
  </header>

  <main class="page">
    <section class="card center" id="state-loading">
      <div class="spinner" aria-hidden="true"></div>
      <p class="muted" data-i18n="loading">Loading…</p>
    </section>

    <section class="card center hidden" id="state-closed">
      <div class="hero-icon warn" aria-hidden="true">!</div>
      <h1 data-i18n="closedTitle">This link is no longer valid</h1>
      <p class="muted" data-i18n="closedBody"></p>
      <p class="error hidden" id="closed-error"></p>
    </section>

    <section class="card center hidden" id="state-done">
      <div class="hero-icon ok" aria-hidden="true">✓</div>
      <h1 data-i18n="doneTitle">Almost there!</h1>
      <p class="muted" id="done-body"></p>
      <a class="primary as-link" id="open-portal" href="/" data-i18n="openPortal">Go to the volunteer space</a>
    </section>

    <form class="card hidden" id="form" novalidate autocomplete="on">
      <h1 data-i18n="signupTitle">Volunteer registration</h1>
      <p class="lead" id="lead"></p>

      <ol class="stepper" id="stepper" aria-label="Progress"></ol>

      <!-- Step 1: account -->
      <fieldset class="step" data-step="1">
        <legend class="step-title" data-i18n="stepAccount">Your account</legend>
        <label>
          <span data-i18n="email">E-mail address</span>
          <input id="email" type="email" autocomplete="email" inputmode="email" maxlength="254" required />
        </label>
        <label>
          <span data-i18n="password">Password</span>
          <span class="pw-wrap">
            <input id="password" type="password" autocomplete="new-password" minlength="10" maxlength="128" required />
            <button type="button" class="pw-toggle" data-target="password" aria-label="Show password">👁</button>
          </span>
        </label>
        <div class="meter" aria-hidden="true"><span id="meter-bar"></span></div>
        <p class="hint" id="meter-label"></p>
        <p class="hint" data-i18n="passwordHint"></p>
        <label>
          <span data-i18n="passwordConfirm">Confirm the password</span>
          <input id="password2" type="password" autocomplete="new-password" maxlength="128" required />
        </label>
        <label class="check">
          <input id="consent" type="checkbox" />
          <span id="consent-text"></span>
        </label>
      </fieldset>

      <!-- Step 2: profile -->
      <fieldset class="step hidden" data-step="2">
        <legend class="step-title" data-i18n="stepProfile">About you</legend>
        <div class="row-2">
          <label>
            <span data-i18n="firstName">First name</span>
            <input id="firstName" autocomplete="given-name" maxlength="60" required />
          </label>
          <label>
            <span data-i18n="lastName">Last name</span>
            <input id="lastName" autocomplete="family-name" maxlength="60" required />
          </label>
        </div>
        <label>
          <span data-i18n="phone">Phone number</span>
          <input id="phone" type="tel" autocomplete="tel" inputmode="tel" maxlength="32" required />
        </label>
        <div class="row-2" id="dob-gender">
          <label>
            <span data-i18n="dateOfBirth">Date of birth</span>
            <input id="dob" type="date" autocomplete="bday" min="1900-01-01" required />
          </label>
          <label>
            <span data-i18n="gender">Gender</span>
            <select id="gender" class="field" required></select>
          </label>
        </div>
      </fieldset>

      <!-- Step 3: photo (only when the institution enabled profile photos) -->
      <fieldset class="step hidden" data-step="3">
        <legend class="step-title" data-i18n="stepPhoto">Profile photo</legend>
        <p class="muted photo-intro" data-i18n="photoIntro"></p>
        <button type="button" class="photo-preview" id="preview" data-i18n-aria="choosePhoto">
          <span class="photo-placeholder" aria-hidden="true">
            <svg viewBox="0 0 24 24" width="44" height="44" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
              <circle cx="12" cy="8" r="4" />
              <path d="M4 21c0-4.4 3.6-8 8-8s8 3.6 8 8" />
            </svg>
          </span>
        </button>
        <input id="file" type="file" accept="image/*" hidden />
        <button type="button" class="ghost" id="choose" data-i18n="choosePhoto">Choose a photo</button>
      </fieldset>

      <p class="error hidden" id="error" role="alert"></p>

      <div class="nav-row">
        <button type="button" class="ghost" id="back" data-i18n="back">Back</button>
        <button type="submit" class="primary" id="next" data-i18n="next">Continue</button>
      </div>
      <button type="button" class="link-btn hidden" id="skip" data-i18n="skipPhoto">Skip this step</button>
    </form>
  </main>
  <script type="module" src="/topo.js?v=topo-perf-1"></script>
  <script type="module" src="/signup.js?v=guest-2"></script>
</body>
</html>
